name: Build Android APK from Web App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GEMINI_CLI_TRUST_WORKSPACE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Gemini CLI Android migration
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.5-flash
          gemini_debug: false
          prompt: |
            Inspect the complete web application in this repository.
            Rebuild it as a native Android app using Kotlin and Jetpack Compose.
            Keep the original web app unchanged.
            Create a new folder named android-app with a complete working Android project.
            Preserve the app name, major features, business logic, localStorage state, navigation, and visual identity.
            Use a valid package name based on the app or repository.
            Do not use WebView, Capacitor, or wrap the original website.
            Generate a working debug APK.

      - name: Check Android project exists
        run: |
          if [ ! -d "android-app" ]; then
            echo "Gemini CLI did not create the android-app folder."
            exit 1
          fi

      - name: Check Gradle wrapper
        run: |
          if [ ! -f "android-app/gradlew" ]; then
            echo "The Gradle wrapper was not created."
            exit 1
          fi
          chmod +x android-app/gradlew

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          APK_PATH="android-app/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK was not found at: $APK_PATH"
            exit 1
          fi
          echo "APK generated successfully:"
          ls -lh "$APK_PATH"

      - name: Commit generated Android project
        if: ${{ success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add android-app
          if git diff --cached --quiet; then
            echo "No Android project changes to commit."
          else
            git commit -m "feat: rebuild web app as native Android app"
            git push
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
