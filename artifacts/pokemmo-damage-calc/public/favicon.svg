<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="redHalf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="whiteHalf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <clipPath id="ballClip">
      <circle cx="256" cy="256" r="216" />
    </clipPath>
  </defs>

  

  <!-- Main Ball -->
  <g filter="url(#shadow)">
    <!-- Outer rim -->
    <circle cx="256" cy="256" r="220" fill="#0f172a" stroke="#334155" stroke-width="3" />

    <!-- Upper Red Half -->
    <path d="M 40 256 A 216 216 0 0 1 472 256 Z" fill="url(#redHalf)" />
    <!-- Lower White Half -->
    <path d="M 40 256 A 216 216 0 0 0 472 256 Z" fill="url(#whiteHalf)" />

    <!-- Gloss Highlight Upper Left -->
    <ellipse cx="169.6" cy="158.8" rx="75.6" ry="38.879999999999995" transform="rotate(-30, 169.6, 158.8)" fill="#ffffff" opacity="0.35" />

    <!-- Center Black Horizontal Band -->
    <rect x="40" y="225.76" width="432" height="60.480000000000004" fill="url(#bandGrad)" clip-path="url(#ballClip)" />

    <!-- Center Outer Circle -->
    <circle cx="256" cy="256" r="77.75999999999999" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <circle cx="256" cy="256" r="60.480000000000004" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <circle cx="256" cy="256" r="38.879999999999995" fill="url(#glowBtn)" />

    <!-- Combat Damage Swords / Lightning Spark Icon in center button -->
    <!-- Left sword -->
    <path d="M 241.6 241.6 L 270.4 270.4" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" />
    <path d="M 238.9 247.9 L 247.9 238.9" stroke="#ffffff" stroke-width="2.7" stroke-linecap="round" />
    <!-- Right sword -->
    <path d="M 270.4 241.6 L 241.6 270.4" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" />
    <path d="M 273.1 247.9 L 264.1 238.9" stroke="#ffffff" stroke-width="2.7" stroke-linecap="round" />
    <!-- Center power gem -->
    <circle cx="256" cy="256" r="4.5" fill="#ffffff" />
  </g>
</svg>